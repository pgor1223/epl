<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>英超戰報 — 英格蘭超級聯賽 2026/27 繁體中文資訊站</title>
  <meta name="description" content="英超戰報主頁：英格蘭超級聯賽最新頭條、焦點戰、精選影片與最新賽果，全部繁體中文，時間以香港時間顯示。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%237a1fff'/%3E%3Ccircle cx='32' cy='32' r='18' fill='none' stroke='%2300ff87' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%2300ff87'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home">

  <header class="topbar" id="topbar"></header>

  <!-- ===== 頭條 ===== -->
  <section class="hero">
    <div class="wrap hero-grid">
      <article class="feature" id="feature"></article>
      <aside class="side">
        <div class="card next-match">
          <div class="card-head"><h3>焦點戰</h3><span class="en">Next up</span></div>
          <div id="nextMatch"></div>
        </div>
        <div class="card">
          <div class="card-head"><h3>積分榜前五</h3><span class="en">Top 5</span></div>
          <table class="mini-table"><tbody id="miniTable"></tbody></table>
          <a class="mini-link" href="table.html">查看完整積分榜 →</a>
        </div>
      </aside>
    </div>
  </section>

  <div class="ticker" aria-label="最新賽果">
    <div class="ticker-inner">
      <div class="ticker-label">最新賽果</div>
      <div class="ticker-viewport"><div class="ticker-track" id="ticker"></div></div>
    </div>
  </div>

  <!-- ===== 最新消息 ===== -->
  <section class="block">
    <div class="wrap">
      <div class="section-head">
        <div>
          <h2>最新消息<span class="en">News</span></h2>
          <p class="desc">賽事報道、轉會動態與聯賽專題</p>
        </div>
        <a class="more" href="news.html">查看全部新聞 →</a>
      </div>
      <div class="news-grid" id="homeNews"></div>
    </div>
  </section>

  <!-- ===== 精選影片 ===== -->
  <section class="block">
    <div class="wrap">
      <div class="section-head">
        <div>
          <h2>精選影片<span class="en">Videos</span></h2>
          <p class="desc">廣東話足球評論頻道的最新影片</p>
        </div>
        <a class="more" href="videos.html">更多影片 →</a>
      </div>
      <div class="video-grid" id="homeVideos"></div>
    </div>
  </section>

  <!-- ===== 最近賽果 ===== -->
  <section class="block">
    <div class="wrap">
      <div class="section-head">
        <div>
          <h2>最近賽果<span class="en">Latest</span></h2>
          <p class="desc">時間為香港時間（UTC+8）</p>
        </div>
        <a class="more" href="results.html">全部賽果賽程 →</a>
      </div>
      <div class="match-grid" id="homeResults"></div>
    </div>
  </section>

  <footer id="footer"></footer>

  <script src="js/data.js"></script>
  <!-- live.js 由 tools/update-epl.ps1 自動產生（賽果、賽程、助攻榜、影片） -->
  <script src="js/live.js"></script>
  <script>
    /* 若 live.js 尚未產生，仍讓頁面正常顯示 */
    var RESULTS = window.RESULTS || []; var FIXTURES = window.FIXTURES || [];
    var ASSISTS = window.ASSISTS || []; var LIVE = window.LIVE || null;
    var VIDEOS = window.VIDEOS || [];
  </script>
  <script src="js/app.js"></script>
</body>
</html>
