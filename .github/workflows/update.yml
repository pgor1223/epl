name: Update results

on:
  schedule:
    - cron: "7 * * * *"        # 每小時第 7 分鐘（UTC）執行
  workflow_dispatch:           # 亦可在 GitHub 的 Actions 頁手動執行

permissions:
  contents: write

concurrency:
  group: update-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run updater (tools/update-epl.ps1)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/update-epl.ps1

      - name: Commit and push if results changed
        shell: bash
        run: |
          git config user.name "epl-update-bot"
          git config user.email "actions@users.noreply.github.com"
          git add js/live.js tools/results-cache.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update results ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
