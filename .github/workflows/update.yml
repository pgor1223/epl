name: Update results

on:
  schedule:
    - cron: "7 * * * *"        # 每小時第 7 分鐘（UTC）執行
  workflow_dispatch:           # 亦可在 GitHub 的 Actions 頁手動執行

permissions:
  contents: write

concurrency:
  group: update-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run updater (tools/update-epl.ps1)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/update-epl.ps1

      - name: Commit and push if results changed
        shell: bash
        run: |
          git config user.name "epl-update-bot"
          git config user.email "actions@users.noreply.github.com"
          # 只計算「產生時間戳記」以外的變動，避免賽果沒變也每小時 commit
          # grep 在沒有結果時回傳 1，配合 pipefail 會令步驟失敗，故加上 || true
          real_changes=$( (git diff -U0 -- js/live.js \
            | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' \
            | grep -vE '^[+-](/\* 自動產生|var LIVE = )' || true) | wc -l)
          if [ "$real_changes" -eq 0 ]; then
            echo "No result changes (timestamp only). Skipping commit."
            git checkout -- js/live.js tools/results-cache.json tools/videos-cache.json
          else
            git add js/live.js tools/results-cache.json tools/videos-cache.json
            git commit -m "chore: update results ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
